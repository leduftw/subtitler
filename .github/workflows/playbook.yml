# Managed by leduftw/playbook v1. Change it there, not here:
# https://github.com/leduftw/playbook
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: playbook-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  playbook:
    uses: leduftw/playbook/.github/workflows/pipeline.yml@3c889e9bb61eb8b3e889b862145b9c2c0ec2769f
    with:
      playbook-ref: 3c889e9bb61eb8b3e889b862145b9c2c0ec2769f
    # The release jobs read the release environment's secrets (the tap deploy
    # key, the WinGet token); a called workflow sees no secrets unless passed.
    secrets: inherit
    # GitHub checks these against every job in the pipeline, including the ones
    # only published repos run; each job then narrows them to what it needs.
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      attestations: write

  registry:
    needs: playbook
    # Runs even when another channel failed, so one broken channel can't
    # hold back the registry.
    if: ${{ !cancelled() && needs.playbook.outputs.released == 'true' }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: leduftw/playbook/.github/actions/registry@3c889e9bb61eb8b3e889b862145b9c2c0ec2769f
        with:
          sha: ${{ needs.playbook.outputs.sha }}
          playbook-ref: 3c889e9bb61eb8b3e889b862145b9c2c0ec2769f
